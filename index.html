<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Fire Tournament Arena | Premium Esports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: {
              purple: '#a855f7',
              blue: '#3b82f6',
              pink: '#ec4899',
              cyan: '#06b6d4'
            },
            dark: {
              900: '#0a0a0f',
              800: '#12121a',
              700: '#1a1a2e',
              600: '#25253a'
            }
          },
          fontFamily: {
            gaming: ['Orbitron', 'Rajdhani', 'sans-serif'],
            body: ['Inter', 'system-ui', 'sans-serif']
          },
          animation: {
            'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
            'float': 'float 3s ease-in-out infinite',
            'slide-up': 'slide-up 0.5s ease-out'
          },
          keyframes: {
            'pulse-glow': {
              '0%, 100%': { boxShadow: '0 0 20px rgba(168, 85, 247, 0.4)' },
              '50%': { boxShadow: '0 0 40px rgba(168, 85, 247, 0.8)' }
            },
            'float': {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' }
            },
            'slide-up': {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .font-gaming { font-family: 'Orbitron', 'Rajdhani', sans-serif; }
    .glass {
      background: rgba(26, 26, 46, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(168, 85, 247, 0.15);
    }
    .glass-strong {
      background: rgba(18, 18, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(168, 85, 247, 0.25);
    }
    .gradient-text {
      background: linear-gradient(135deg, #a855f7, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #6366f1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      transition: all 0.3s ease;
    }
    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
    }
    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-6px);
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(168, 85, 247, 0.15);
    }
    .nav-link {
      position: relative;
      transition: color 0.2s;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #a855f7, #3b82f6);
      transition: width 0.3s ease;
    }
    .nav-link:hover::after, .nav-link.active::after {
      width: 100%;
    }
    .nav-link.active { color: #a855f7; }
    .input-field {
      background: rgba(15, 15, 25, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.2);
      transition: all 0.3s;
    }
    .input-field:focus {
      outline: none;
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .hero-bg {
      background: radial-gradient(ellipse at 30% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 60%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 100%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                  #0a0a0f;
    }
    .badge-solo { background: linear-gradient(135deg, #f59e0b, #ef4444); }
    .badge-duo { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
    .badge-squad { background: linear-gradient(135deg, #10b981, #06b6d4); }
    .status-live { animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .modal-overlay {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
    }
    .toast {
      animation: slide-up 0.3s ease-out;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #12121a; }
    ::-webkit-scrollbar-thumb { background: #3b3b5a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #a855f7; }
  </style>
</head>
<body class="hero-bg min-h-screen">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback, createContext, useContext, useMemo } = React;

    // ==================== MOCK DATA & STORAGE ====================
    const STORAGE_KEYS = {
      users: 'ff_users',
      tournaments: 'ff_tournaments',
      registrations: 'ff_registrations',
      notifications: 'ff_notifications',
      currentUser: 'ff_currentUser',
      isAdmin: 'ff_isAdmin'
    };

    const defaultTournaments = [
      {
        id: 't1',
        name: 'Phoenix Rising Championship',
        type: 'Squad',
        prizePool: 50000,
        entryFee: 50,
        date: '2026-08-15',
        time: '20:00',
        slots: 100,
        filled: 67,
        status: 'upcoming',
        description: 'The ultimate Free Fire squad battle. Top teams compete for glory and massive prizes. Only the strongest will rise!',
        rules: '• Must have 4 players\n• No emulators allowed\n• Fair play policy strictly enforced\n• Room ID shared 15 mins before start\n• Screenshots of kills required for disputes',
        banner: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&q=80',
        roomId: null,
        roomPass: null,
        createdAt: Date.now() - 86400000 * 5
      },
      {
        id: 't2',
        name: 'Solo Sniper Showdown',
        type: 'Solo',
        prizePool: 15000,
        entryFee: 20,
        date: '2026-08-10',
        time: '19:00',
        slots: 50,
        filled: 42,
        status: 'upcoming',
        description: 'Prove your individual skill in this intense solo tournament. One player, one goal – domination.',
        rules: '• Solo only\n• Headshot bonus scoring\n• No teaming\n• Device check may be required',
        banner: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800&q=80',
        roomId: null,
        roomPass: null,
        createdAt: Date.now() - 86400000 * 3
      },
      {
        id: 't3',
        name: 'Duo Dominators Cup',
        type: 'Duo',
        prizePool: 25000,
        entryFee: 30,
        date: '2026-08-12',
        time: '21:00',
        slots: 60,
        filled: 28,
        status: 'upcoming',
        description: 'Partner up and dominate the battlefield. Perfect coordination wins the day.',
        rules: '• Exactly 2 players\n• Communication via in-game only preferred\n• Fair play enforced',
        banner: 'https://images.unsplash.com/photo-1493711662062-fa541f7f3f84?w=800&q=80',
        roomId: null,
        roomPass: null,
        createdAt: Date.now() - 86400000 * 2
      },
      {
        id: 't4',
        name: 'Weekend Warriors',
        type: 'Squad',
        prizePool: 10000,
        entryFee: 0,
        date: '2026-08-08',
        time: '18:00',
        slots: 80,
        filled: 80,
        status: 'full',
        description: 'Free entry weekend special! Bring your squad and compete for prizes.',
        rules: '• Free entry\n• Squad of 4\n• Standard BR rules',
        banner: 'https://images.unsplash.com/photo-1552820728-8b83bb6b773f?w=800&q=80',
        roomId: 'ROOM-8842',
        roomPass: 'FFWIN26',
        createdAt: Date.now() - 86400000
      }
    ];

    const initStorage = () => {
      if (!localStorage.getItem(STORAGE_KEYS.tournaments)) {
        localStorage.setItem(STORAGE_KEYS.tournaments, JSON.stringify(defaultTournaments));
      }
      if (!localStorage.getItem(STORAGE_KEYS.users)) {
        localStorage.setItem(STORAGE_KEYS.users, JSON.stringify([]));
      }
      if (!localStorage.getItem(STORAGE_KEYS.registrations)) {
        localStorage.setItem(STORAGE_KEYS.registrations, JSON.stringify([]));
      }
      if (!localStorage.getItem(STORAGE_KEYS.notifications)) {
        localStorage.setItem(STORAGE_KEYS.notifications, JSON.stringify([]));
      }
    };

    const getData = (key) => JSON.parse(localStorage.getItem(key) || '[]');
    const setData = (key, data) => localStorage.setItem(key, JSON.stringify(data));

    // ==================== CONTEXT ====================
    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [tournaments, setTournaments] = useState([]);
      const [registrations, setRegistrations] = useState([]);
      const [notifications, setNotifications] = useState([]);
      const [page, setPage] = useState('home');
      const [selectedTournament, setSelectedTournament] = useState(null);
      const [toast, setToast] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        initStorage();
        const savedUser = localStorage.getItem(STORAGE_KEYS.currentUser);
        const savedAdmin = localStorage.getItem(STORAGE_KEYS.isAdmin) === 'true';
        if (savedUser) {
          setUser(JSON.parse(savedUser));
          setIsAdmin(savedAdmin);
        }
        setTournaments(getData(STORAGE_KEYS.tournaments));
        setRegistrations(getData(STORAGE_KEYS.registrations));
        setNotifications(getData(STORAGE_KEYS.notifications));
        setLoading(false);
      }, []);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const login = (email, password) => {
        const users = getData(STORAGE_KEYS.users);
        const found = users.find(u => u.email === email && u.password === password);
        if (found) {
          setUser(found);
          localStorage.setItem(STORAGE_KEYS.currentUser, JSON.stringify(found));
          const admin = email === 'admin@fftournaments.com';
          setIsAdmin(admin);
          localStorage.setItem(STORAGE_KEYS.isAdmin, admin.toString());
          showToast('Welcome back, ' + found.nickname + '!');
          setPage(admin ? 'admin' : 'dashboard');
          return true;
        }
        // Demo admin
        if (email === 'admin@fftournaments.com' && password === 'admin123') {
          const adminUser = { id: 'admin', email, nickname: 'Admin', ffUid: 'ADMIN001', avatar: null };
          setUser(adminUser);
          setIsAdmin(true);
          localStorage.setItem(STORAGE_KEYS.currentUser, JSON.stringify(adminUser));
          localStorage.setItem(STORAGE_KEYS.isAdmin, 'true');
          showToast('Admin logged in!');
          setPage('admin');
          return true;
        }
        showToast('Invalid credentials', 'error');
        return false;
      };

      const signup = (data) => {
        const users = getData(STORAGE_KEYS.users);
        if (users.find(u => u.email === data.email)) {
          showToast('Email already registered', 'error');
          return false;
        }
        const newUser = {
          id: 'u' + Date.now(),
          ...data,
          createdAt: Date.now()
        };
        users.push(newUser);
        setData(STORAGE_KEYS.users, users);
        setUser(newUser);
        localStorage.setItem(STORAGE_KEYS.currentUser, JSON.stringify(newUser));
        localStorage.setItem(STORAGE_KEYS.isAdmin, 'false');
        setIsAdmin(false);
        showToast('Account created successfully!');
        setPage('dashboard');
        return true;
      };

      const logout = () => {
        setUser(null);
        setIsAdmin(false);
        localStorage.removeItem(STORAGE_KEYS.currentUser);
        localStorage.removeItem(STORAGE_KEYS.isAdmin);
        setPage('home');
        showToast('Logged out successfully');
      };

      const registerForTournament = (tournamentId, regData) => {
        const regs = getData(STORAGE_KEYS.registrations);
        if (regs.find(r => r.tournamentId === tournamentId && r.userId === user.id)) {
          showToast('Already registered!', 'error');
          return false;
        }
        const newReg = {
          id: 'r' + Date.now(),
          tournamentId,
          userId: user.id,
          ...regData,
          status: 'pending',
          createdAt: Date.now()
        };
        regs.push(newReg);
        setData(STORAGE_KEYS.registrations, regs);
        setRegistrations(regs);

        // Update filled slots
        const tourns = getData(STORAGE_KEYS.tournaments);
        const idx = tourns.findIndex(t => t.id === tournamentId);
        if (idx !== -1) {
          tourns[idx].filled = (tourns[idx].filled || 0) + 1;
          if (tourns[idx].filled >= tourns[idx].slots) tourns[idx].status = 'full';
          setData(STORAGE_KEYS.tournaments, tourns);
          setTournaments(tourns);
        }

        // Notification
        addNotification(user.id, 'Registration Successful', `You registered for ${tourns[idx]?.name || 'tournament'}. Awaiting approval.`, 'success');
        showToast('Registration submitted! Awaiting admin approval.');
        return true;
      };

      const addNotification = (userId, title, message, type = 'info') => {
        const notifs = getData(STORAGE_KEYS.notifications);
        notifs.unshift({
          id: 'n' + Date.now(),
          userId,
          title,
          message,
          type,
          read: false,
          createdAt: Date.now()
        });
        setData(STORAGE_KEYS.notifications, notifs);
        setNotifications(notifs);
      };

      const createTournament = (data) => {
        const tourns = getData(STORAGE_KEYS.tournaments);
        const newT = {
          id: 't' + Date.now(),
          ...data,
          filled: 0,
          status: 'upcoming',
          roomId: null,
          roomPass: null,
          createdAt: Date.now()
        };
        tourns.unshift(newT);
        setData(STORAGE_KEYS.tournaments, tourns);
        setTournaments(tourns);
        showToast('Tournament created!');
      };

      const updateTournament = (id, data) => {
        const tourns = getData(STORAGE_KEYS.tournaments);
        const idx = tourns.findIndex(t => t.id === id);
        if (idx !== -1) {
          tourns[idx] = { ...tourns[idx], ...data };
          setData(STORAGE_KEYS.tournaments, tourns);
          setTournaments(tourns);
          showToast('Tournament updated!');
        }
      };

      const deleteTournament = (id) => {
        let tourns = getData(STORAGE_KEYS.tournaments);
        tourns = tourns.filter(t => t.id !== id);
        setData(STORAGE_KEYS.tournaments, tourns);
        setTournaments(tourns);
        showToast('Tournament deleted');
      };

      const approveRegistration = (regId) => {
        const regs = getData(STORAGE_KEYS.registrations);
        const idx = regs.findIndex(r => r.id === regId);
        if (idx !== -1) {
          regs[idx].status = 'approved';
          setData(STORAGE_KEYS.registrations, regs);
          setRegistrations(regs);
          addNotification(regs[idx].userId, 'Registration Approved', 'Your registration has been approved! Get ready.', 'success');
          showToast('Registration approved');
        }
      };

      const releaseRoom = (tournamentId, roomId, roomPass) => {
        updateTournament(tournamentId, { roomId, roomPass });
        const regs = getData(STORAGE_KEYS.registrations).filter(r => r.tournamentId === tournamentId && r.status === 'approved');
        regs.forEach(r => {
          addNotification(r.userId, 'Room Details Released', `Room ID: ${roomId} | Password: ${roomPass}`, 'info');
        });
        showToast('Room details released to players!');
      };

      const value = {
        user, isAdmin, tournaments, registrations, notifications, page, selectedTournament, toast, loading,
        setPage, setSelectedTournament, login, signup, logout, registerForTournament,
        createTournament, updateTournament, deleteTournament, approveRegistration, releaseRoom,
        showToast, addNotification, getData, setData
      };

      return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
    };

    const useApp = () => useContext(AppContext);

    // ==================== COMPONENTS ====================
    const Toast = () => {
      const { toast } = useApp();
      if (!toast) return null;
      const bg = toast.type === 'error' ? 'bg-red-500/90' : toast.type === 'info' ? 'bg-blue-500/90' : 'bg-emerald-500/90';
      return (
        <div className={`fixed top-6 right-6 z-[100] ${bg} text-white px-6 py-3 rounded-xl shadow-2xl toast font-medium flex items-center gap-3`}>
          <span>{toast.type === 'error' ? '✕' : '✓'}</span>
          {toast.message}
        </div>
      );
    };

    const Navbar = () => {
      const { user, isAdmin, page, setPage, logout, notifications } = useApp();
      const [menuOpen, setMenuOpen] = useState(false);
      const unread = notifications.filter(n => n.userId === user?.id && !n.read).length;

      const navItems = user
        ? [
            { id: 'dashboard', label: 'Dashboard' },
            { id: 'tournaments', label: 'Tournaments' },
            { id: 'my-tournaments', label: 'My Tournaments' },
            { id: 'profile', label: 'Profile' },
            ...(isAdmin ? [{ id: 'admin', label: 'Admin' }] : [])
          ]
        : [
            { id: 'home', label: 'Home' },
            { id: 'tournaments', label: 'Tournaments' },
            { id: 'login', label: 'Login' }
          ];

      return (
        <nav className="fixed top-0 left-0 right-0 z-50 glass-strong border-b border-purple-500/20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6">
            <div className="flex items-center justify-between h-16">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setPage(user ? 'dashboard' : 'home')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center font-gaming font-bold text-white text-lg shadow-lg shadow-purple-500/30">
                  FF
                </div>
                <span className="font-gaming font-bold text-xl gradient-text hidden sm:block">TOURNAMENT ARENA</span>
              </div>

              <div className="hidden md:flex items-center gap-8">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setPage(item.id)}
                    className={`nav-link text-sm font-medium ${page === item.id ? 'active text-purple-400' : 'text-gray-300 hover:text-white'}`}
                  >
                    {item.label}
                  </button>
                ))}
                {user && (
                  <button onClick={logout} className="text-sm text-red-400 hover:text-red-300 font-medium">
                    Logout
                  </button>
                )}
              </div>

              <div className="flex items-center gap-3">
                {user && (
                  <button onClick={() => setPage('dashboard')} className="relative p-2 text-gray-300 hover:text-purple-400">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                    {unread > 0 && <span className="absolute -top-1 -right-1 w-5 h-5 bg-purple-500 rounded-full text-xs flex items-center justify-center">{unread}</span>}
                  </button>
                )}
                <button className="md:hidden p-2 text-gray-300" onClick={() => setMenuOpen(!menuOpen)}>
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={menuOpen ? "M6 18L18 6M6 6l12 12" : "M4 6h16M4 12h16M4 18h16"} /></svg>
                </button>
              </div>
            </div>

            {menuOpen && (
              <div className="md:hidden pb-4 space-y-2 animate-slide-up">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setPage(item.id); setMenuOpen(false); }}
                    className={`block w-full text-left px-4 py-2 rounded-lg ${page === item.id ? 'bg-purple-500/20 text-purple-400' : 'text-gray-300'}`}
                  >
                    {item.label}
                  </button>
                ))}
                {user && <button onClick={() => { logout(); setMenuOpen(false); }} className="block w-full text-left px-4 py-2 text-red-400">Logout</button>}
              </div>
            )}
          </div>
        </nav>
      );
    };

    const Footer = () => (
      <footer className="border-t border-purple-500/10 mt-20">
        <div className="max-w-7xl mx-auto px-4 py-12">
          <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
            <div>
              <div className="flex items-center gap-2 mb-4">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center font-gaming font-bold text-sm">FF</div>
                <span className="font-gaming font-bold gradient-text">ARENA</span>
              </div>
              <p className="text-gray-400 text-sm">Premium Free Fire tournament platform. Compete, win, dominate.</p>
            </div>
            <div>
              <h4 className="font-semibold text-white mb-3">Quick Links</h4>
              <ul className="space-y-2 text-sm text-gray-400">
                <li>Tournaments</li>
                <li>Leaderboard</li>
                <li>Rules</li>
                <li>Support</li>
              </ul>
            </div>
            <div>
              <h4 className="font-semibold text-white mb-3">Legal</h4>
              <ul className="space-y-2 text-sm text-gray-400">
                <li>Terms of Service</li>
                <li>Privacy Policy</li>
                <li>Refund Policy</li>
              </ul>

          <div className="relative h-64 md:h-80">
            <img src={t.banner} alt={t.name} className="w-full h-full object-cover" onError={(e) => e.target.src = 'https://via.placeholder.com/1200x400/1a1a2e/a855f7?text=Tournament'} />
            <div className="absolute inset-0 bg-gradient-to-t from-dark-900 via-dark-900/60 to-transparent"></div>
            <div className="absolute bottom-0 left-0 right-0 p-6 max-w-7xl mx-auto">
              <button onClick={() => setPage('tournaments')} className="text-sm text-gray-300 hover:text-white mb-3 flex items-center gap-1">← Back</button>
              <div className="flex flex-wrap items-center gap-3 mb-2">
                <span className={`text-xs px-3 py-1 rounded-full text-white font-medium badge-${t.type.toLowerCase()}`}>{t.type}</span>
                {t.entryFee === 0 && <span className="text-xs px-3 py-1 rounded-full bg-emerald-500 text-white font-medium">FREE ENTRY</span>}
              </div>
              <h1 className="font-gaming text-3xl md:text-4xl font-bold text-white">{t.name}</h1>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 -mt-6 relative z-10">
            <div className="grid lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 space-y-6">
                <div className="glass rounded-xl p-6">
                  <h2 className="font-semibold text-lg mb-3">Description</h2>
                  <p className="text-gray-300 leading-relaxed">{t.description}</p>
                </div>
                <div className="glass rounded-xl p-6">
                  <h2 className="font-semibold text-lg mb-3">Rules</h2>
                  <pre className="text-gray-300 text-sm whitespace-pre-wrap font-sans">{t.rules}</pre>
                </div>
                {isRegistered && isRegistered.status === 'approved' && t.roomId && (
                  <div className="glass rounded-xl p-6 border border-emerald-500/30">
                    <h2 className="font-semibold text-lg mb-3 text-emerald-400">🎮 Room Details</h2>
                    <div className="grid sm:grid-cols-2 gap-4">
                      <div className="bg-dark-700/50 rounded-lg p-4">
                        <div className="text-xs text-gray-400">Room ID</div>
                        <div className="font-gaming text-xl font-bold text-white mt-1">{t.roomId}</div>
                      </div>
                      <div className="bg-dark-700/50 rounded-lg p-4">
                        <div className="text-xs text-gray-400">Password</div>
                        <div className="font-gaming text-xl font-bold text-white mt-1">{t.roomPass}</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <div className="space-y-4">
                <div className="glass rounded-xl p-6 sticky top-24">
                  <div className="space-y-4 mb-6">
                    <div className="flex justify-between">
                      <span className="text-gray-400">Prize Pool</span>
                      <span className="font-gaming font-bold text-purple-400">₹{t.prizePool.toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Entry Fee</span>
                      <span className="font-medium">{t.entryFee === 0 ? 'FREE' : `₹${t.entryFee}`}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Date & Time</span>
                      <span className="font-medium">{t.date} • {t.time}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-400">Slots</span>
                      <span className="font-medium">{t.filled}/{t.slots} <span className="text-xs text-gray-500">({remaining} left)</span></span>
                    </div>
                    <div className="w-full bg-dark-700 rounded-full h-2">
                      <div className="bg-gradient-to-r from-purple-500 to-blue-500 h-2 rounded-full" style={{ width: `${(t.filled / t.slots) * 100}%` }}></div>
                    </div>
                  </div>

                  {isRegistered ? (
                    <div className={`text-center py-3 rounded-xl font-medium ${isRegistered.status === 'approved' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-yellow-500/20 text-yellow-400'}`}>
                      {isRegistered.status === 'approved' ? '✅ Registered & Approved' : '⏳ Registration Pending'}
                    </div>
                  ) : t.status === 'full' ? (
                    <div className="text-center py-3 rounded-xl bg-red-500/20 text-red-400 font-medium">Tournament Full</div>
                  ) : (
                    <button onClick={() => user ? setShowRegModal(true) : setPage('login')} className="w-full btn-primary py-3.5 rounded-xl font-semibold text-white">
                      Register Now
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* Registration Modal */}
          {showRegModal && (
            <div className="fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4" onClick={() => setShowRegModal(false)}>
              <div className="glass-strong rounded-2xl p-6 w-full max-w-md animate-slide-up" onClick={e => e.stopPropagation()}>
                <h2 className="font-gaming text-xl font-bold mb-4">Register for {t.name}</h2>
                <form onSubmit={handleRegister} className="space-y-4">
                  <div>
                    <label className="text-xs text-gray-400 mb-1 block">Nickname</label>
                    <input required className="input-field w-full px-4 py-3 rounded-xl text-white" value={regForm.nickname} onChange={e => setRegForm({...regForm, nickname: e.target.value})} />
                  </div>
                  <div>
                    <label className="text-xs text-gray-400 mb-1 block">Free Fire UID</label>
                    <input required className="input-field w-full px-4 py-3 rounded-xl text-white" value={regForm.ffUid} onChange={e => setRegForm({...regForm, ffUid: e.target.value})} />
                  </div>
                  {(t.type === 'Duo' || t.type === 'Squad') && (
                    <div>
                      <label className="text-xs text-gray-400 mb-1 block">Team Name</label>
                      <input required className="input-field w-full px-4 py-3 rounded-xl text-white" placeholder="Your team name" value={regForm.teamName} onChange={e => setRegForm({...regForm, teamName: e.target.value})} />
                    </div>
                  )}
                  <div>
                    <label className="text-xs text-gray-400 mb-1 block">Screenshot (optional)</label>
                    <input type="file" accept="image/*" className="input-field w-full px-4 py-3 rounded-xl text-white text-sm" onChange={e => setRegForm({...regForm, screenshot: e.target.files[0]?.name})} />
                  </div>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setShowRegModal(false)} className="flex-1 py-3 rounded-xl border border-gray-600 text-gray-300 hover:bg-white/5">Cancel</button>
                    <button type="submit" className="flex-1 btn-primary py-3 rounded-xl font-semibold text-white">Submit</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    const MyTournamentsPage = () => {
      const { user, tournaments, registrations, setSelectedTournament, setPage } = useApp();
      const myRegs = registrations.filter(r => r.userId === user?.id);

      return (
        <div className="pt-20 pb-12 px-4 max-w-7xl mx-auto">
          <h1 className="font-gaming text-3xl font-bold mb-2">My <span className="gradient-text">Tournaments</span></h1>
          <p className="text-gray-400 mb-8">Track your registrations and match details</p>

          {myRegs.length === 0 ? (
            <div className="glass rounded-xl p-12 text-center">
              <div className="text-4xl mb-4">🎮</div>
              <p className="text-gray-400 mb-4">You haven't registered for any tournaments yet</p>
              <button onClick={() => setPage('tournaments')} className="btn-primary px-6 py-2.5 rounded-xl text-white font-medium">Browse Tournaments</button>
            </div>
          ) : (
            <div className="space-y-4">
              {myRegs.map(r => {
                const t = tournaments.find(x => x.id === r.tournamentId);
                if (!t) return null;
                return (
                  <div key={r.id} className="glass rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div className="flex items-start gap-4">
                      <img src={t.banner} className="w-20 h-14 rounded-lg object-cover" onError={(e) => e.target.src = 'https://via.placeholder.com/80x56/1a1a2e/a855f7?text=FF'} />
                      <div>
                        <h3 className="font-semibold text-white">{t.name}</h3>
                        <div className="flex flex-wrap gap-2 mt-1 text-xs text-gray-400">
                          <span className={`px-2 py-0.5 rounded badge-${t.type.toLowerCase()} text-white`}>{t.type}</span>
                          <span>{t.date} • {t.time}</span>
                          <span className={r.status === 'approved' ? 'text-emerald-400' : 'text-yellow-400'}>
                            {r.status === 'approved' ? '✅ Approved' : '⏳ Pending'}
                          </span>
                        </div>
                        {r.status === 'approved' && t.roomId && (
                          <div className="mt-2 text-sm">
                            <span className="text-gray-400">Room:</span> <span className="font-mono text-purple-300">{t.roomId}</span>
                            <span className="text-gray-400 ml-3">Pass:</span> <span className="font-mono text-purple-300">{t.roomPass}</span>
                          </div>
                        )}
                      </div>
                    </div>
                    <button onClick={() => { setSelectedTournament(t); setPage('tournament-details'); }} className="text-sm px-4 py-2 rounded-lg border border-purple-500/30 text-purple-300 hover:bg-purple-500/10 whitespace-nowrap">
                      View Details
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    const ProfilePage = () => {
      const { user, registrations, tournaments, logout, setPage } = useApp();
      const myRegs = registrations.filter(r => r.userId === user?.id);

      return (
        <div className="pt-20 pb-12 px-4 max-w-2xl mx-auto">
          <div className="glass rounded-2xl p-8 text-center">
            <div className="w-24 h-24 mx-auto rounded-full bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center font-gaming text-3xl font-bold text-white shadow-lg shadow-purple-500/40 mb-4">
              {user?.nickname?.[0]?.toUpperCase() || 'P'}
            </div>
            <h1 className="font-gaming text-2xl font-bold">{user?.nickname}</h1>
            <p className="text-gray-400 text-sm mt-1">{user?.email}</p>
            <div className="inline-flex items-center gap-2 mt-3 px-4 py-1.5 rounded-full bg-dark-700 text-sm">
              <span className="text-gray-400">FF UID:</span>
              <span className="font-mono text-purple-300">{user?.ffUid}</span>
            </div>

            <div className="grid grid-cols-2 gap-4 mt-8">
              <div className="bg-dark-700/50 rounded-xl p-4">
                <div className="font-gaming text-2xl font-bold text-white">{myRegs.length}</div>
                <div className="text-xs text-gray-400">Tournaments</div>
              </div>
              <div className="bg-dark-700/50 rounded-xl p-4">
                <div className="font-gaming text-2xl font-bold text-white">{myRegs.filter(r => r.status === 'approved').length}</div>
                <div className="text-xs text-gray-400">Approved</div>
              </div>
            </div>

            <div className="mt-8 space-y-3">
              <button onClick={() => setPage('my-tournaments')} className="w-full py-3 rounded-xl border border-purple-500/30 text-purple-300 hover:bg-purple-500/10 transition">
                My Tournaments
              </button>
              <button onClick={logout} className="w-full py-3 rounded-xl bg-red-500/20 text-red-400 hover:bg-red-500/30 transition font-medium">
                Logout
              </button>
            </div>
          </div>
        </div>
      );
    };

    const AdminPage = () => {
      const { tournaments, registrations, createTournament, updateTournament, deleteTournament, approveRegistration, releaseRoom, showToast } = useApp();
      const [tab, setTab] = useState('tournaments');
      const [showCreate, setShowCreate] = useState(false);
      const [editId, setEditId] = useState(null);
      const [roomModal, setRoomModal] = useState(null);
      const [form, setForm] = useState({ name: '', type: 'Squad', prizePool: '', entryFee: '', date: '', time: '', slots: '', description: '', rules: '', banner: '' });

      const pendingRegs = registrations.filter(r => r.status === 'pending');

      const handleCreate = (e) => {
        e.preventDefault();
        const data = {
          ...form,
          prizePool: Number(form.prizePool),
          entryFee: Number(form.entryFee),
          slots: Number(form.slots),
          banner: form.banner || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=800&q=80'
        };
        if (editId) {
          updateTournament(editId, data);
          setEditId(null);
        } else {
          createTournament(data);
        }
        setShowCreate(false);
        setForm({ name: '', type: 'Squad', prizePool: '', entryFee: '', date: '', time: '', slots: '', description: '', rules: '', banner: '' });
      };

      const startEdit = (t) => {
        setForm({
          name: t.name, type: t.type, prizePool: t.prizePool, entryFee: t.entryFee,
          date: t.date, time: t.time, slots: t.slots, description: t.description, rules: t.rules, banner: t.banner
        });
        setEditId(t.id);
        setShowCreate(true);
      };

      const handleReleaseRoom = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        releaseRoom(roomModal, fd.get('roomId'), fd.get('roomPass'));
        setRoomModal(null);
      };

      return (
        <div className="pt-20 pb-12 px-4 max-w-7xl mx-auto">
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="font-gaming text-3xl font-bold">Admin <span className="gradient-text">Panel</span></h1>
              <p className="text-gray-400 text-sm">Manage tournaments & players</p>
            </div>
            <button onClick={() => { setShowCreate(true); setEditId(null); setForm({ name: '', type: 'Squad', prizePool: '', entryFee: '', date: '', time: '', slots: '', description: '', rules: '', banner: '' }); }} className="btn-primary px-5 py-2.5 rounded-xl text-sm font-semibold text-white">
              + Create Tournament
            </button>
          </div>

          <div className="flex gap-2 mb-6 overflow-x-auto">
            {['tournaments', 'registrations'].map(t => (
              <button key={t} onClick={() => setTab(t)} className={`px-5 py-2 rounded-lg text-sm font-medium whitespace-nowrap ${tab === t ? 'bg-purple-500/20 text-purple-300 border border-purple-500/40' : 'text-gray-400 hover:text-white'}`}>
                {t === 'tournaments' ? `Tournaments (${tournaments.length})` : `Pending Registrations (${pendingRegs.length})`}
              </button>
            ))}
          </div>

          {tab === 'tournaments' && (
            <div className="space-y-3">
              {tournaments.map(t => (
                <div key={t.id} className="glass rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <div className="font-medium text-white flex items-center gap-2">
                      {t.name}
                      <span className={`text-xs px-2 py-0.5 rounded badge-${t.type.toLowerCase()} text-white`}>{t.type}</span>
                    </div>
                    <div className="text-xs text-gray-400 mt-1">
                      ₹{t.prizePool.toLocaleString()} • {t.filled}/{t.slots} slots • {t.date} {t.time}
                      {t.roomId && <span className="text-emerald-400 ml-2">• Room Released</span>}
                    </div>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button onClick={() => startEdit(t)} className="text-xs px-3 py-1.5 rounded-lg border border-blue-500/30 text-blue-300 hover:bg-blue-500/10">Edit</button>
                    <button onClick={() => setRoomModal(t.id)} className="text-xs px-3 py-1.5 rounded-lg border border-emerald-500/30 text-emerald-300 hover:bg-emerald-500/10">Room ID</button>
                    <button onClick={() => { if(confirm('Delete this tournament?')) deleteTournament(t.id); }} className="text-xs px-3 py-1.5 rounded-lg border border-red-500/30 text-red-300 hover:bg-red-500/10">Delete</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {tab === 'registrations' && (
            <div className="space-y-3">
              {pendingRegs.length === 0 ? (
                <div className="glass rounded-xl p-8 text-center text-gray-400">No pending registrations</div>
              ) : (
                pendingRegs.map(r => {
                  const t = tournaments.find(x => x.id === r.tournamentId);
                  return (
                    <div key={r.id} className="glass rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <div className="font-medium text-white">{r.nickname} <span className="text-gray-400 font-normal">({r.ffUid})</span></div>
                        <div className="text-xs text-gray-400 mt-1">
                          {t?.name} • {r.teamName ? `Team: ${r.teamName}` : 'Solo'} • {new Date(r.createdAt).toLocaleDateString()}
                        </div>
                      </div>
                      <button onClick={() => approveRegistration(r.id)} className="text-xs px-4 py-2 rounded-lg bg-emerald-500/20 text-emerald-300 hover:bg-emerald-500/30 font-medium">
                        Approve
                      </button>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {/* Create/Edit Modal */}
          {showCreate && (
            <div className="fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4 overflow-y-auto" onClick={() => setShowCreate(false)}>
              <div className="glass-strong rounded-2xl p-6 w-full max-w-lg my-8 animate-slide-up" onClick={e => e.stopPropagation()}>
                <h2 className="font-gaming text-xl font-bold mb-4">{editId ? 'Edit' : 'Create'} Tournament</h2>
                <form onSubmit={handleCreate} className="space-y-3">
                  <input required placeholder="Tournament Name" className="input-field w-full px-4 py-2.5 rounded-xl text-white text-sm" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                  <div className="grid grid-cols-2 gap-3">
                    <select className="input-field px-4 py-2.5 rounded-xl text-white text-sm" value={form.type} onChange={e => setForm({...form, type: e.target.value})}>
                      <option value="Solo">Solo</option>
                      <option value="Duo">Duo</option>
                      <option value="Squad">Squad</option>
                    </select>
                    <input required type="number" placeholder="Slots" className="input-field px-4 py-2.5 rounded-xl text-white text-sm" value={form.slots} onChange={e => setForm({...form, slots: e.target.value})} />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <input required type="number" placeholder="Prize Pool (₹)" className="input-field px-4 py-2.5 rounded-xl text-white text-sm" value={form.prizePool} onChange={e => setForm({...form, prizePool: e.target.value})} />
                    <input required type="number" placeholder="Entry Fee (₹)" className="input-field px-4 py-2.5 rounded-xl text-white text-sm" value={form.entryFee} onChange={e => setForm({...form, entryFee: e.target.value})} />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <input required type="date" className="input-field px-4 py-2.5 rounded-xl text-white text-sm" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
                    <input required type="time" className="input-field px-4 py-2.5 rounded-xl text-white text-sm" value={form.time} onChange={e => setForm({...form, time: e.target.value})} />
                  </div>
                  <textarea required placeholder="Description" rows="2" className="input-field w-full px-4 py-2.5 rounded-xl text-white text-sm" value={form.description} onChange={e => setForm({...form, description: e.target.value})} />
                  <textarea required placeholder="Rules (one per line)" rows="3" className="input-field w-full px-4 py-2.5 rounded-xl text-white text-sm" value={form.rules} onChange={e => setForm({...form, rules: e.target.value})} />
                  <input placeholder="Banner Image URL (optional)" className="input-field w-full px-4 py-2.5 rounded-xl text-white text-sm" value={form.banner} onChange={e => setForm({...form, banner: e.target.value})} />
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setShowCreate(false)} className="flex-1 py-2.5 rounded-xl border border-gray-600 text-gray-300 text-sm">Cancel</button>
                    <button type="submit" className="flex-1 btn-primary py-2.5 rounded-xl font-semibold text-white text-sm">{editId ? 'Update' : 'Create'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Room Modal */}
          {roomModal && (
            <div className="fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4" onClick={() => setRoomModal(null)}>
              <div className="glass-strong rounded-2xl p-6 w-full max-w-sm animate-slide-up" onClick={e => e.stopPropagation()}>
                <h2 className="font-gaming text-lg font-bold mb-4">Release Room Details</h2>
                <form onSubmit={handleReleaseRoom} className="space-y-3">
                  <input name="roomId" required placeholder="Room ID" className="input-field w-full px-4 py-2.5 rounded-xl text-white text-sm" />
                  <input name="roomPass" required placeholder="Password" className="input-field w-full px-4 py-2.5 rounded-xl text-white text-sm" />
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setRoomModal(null)} className="flex-1 py-2.5 rounded-xl border border-gray-600 text-gray-300 text-sm">Cancel</button>
                    <button type="submit" className="flex-1 btn-primary py-2.5 rounded-xl font-semibold text-white text-sm">Release</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ==================== APP ====================
    const App = () => {
      const { page, loading, user } = useApp();

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center font-gaming font-bold text-2xl text-white animate-pulse-glow mb-4">FF</div>
              <p className="text-gray-400 text-sm">Loading Arena...</p>
            </div>
          </div>
        );
      }

      const renderPage = () => {
        switch (page) {
          case 'home': return <HomePage />;
          case 'login': return <LoginPage />;
          case 'dashboard': return user ? <DashboardPage /> : <LoginPage />;
          case 'tournaments': return <TournamentsPage />;
          case 'tournament-details': return <TournamentDetailsPage />;
          case 'my-tournaments': return user ? <MyTournamentsPage /> : <LoginPage />;
          case 'profile': return user ? <ProfilePage /> : <LoginPage />;
          case 'admin': return user ? <AdminPage /> : <LoginPage />;
          default: return <HomePage />;
        }
      };

      return (
        <>
          <Navbar />
          <Toast />
          {renderPage()}
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
