<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Stumble League Manager Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e6edf3;
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 260px;
      background: #161b22;
      border-right: 1px solid #d4af37;
      padding: 1.5rem;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      color: #d4af37;
      margin-bottom: 2rem;
      text-align: center;
    }
    .nav-item {
      padding: 0.8rem 1rem;
      margin: 0.3rem 0;
      border-radius: 8px;
      cursor: pointer;
      color: #8b949e;
      font-weight: 600;
      transition: 0.2s;
    }
    .nav-item:hover, .nav-item.active {
      background: #d4af3720;
      color: #d4af37;
    }
    .main-panel {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    h2 { color: #d4af37; margin-bottom: 1rem; }
    h3 { color: #f0c040; margin: 1rem 0; }
    button {
      background: #d4af37;
      color: #0d1117;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin: 0.2rem;
    }
    button:hover { background: #e5c550; }
    select, input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 0.5rem;
      border-radius: 6px;
      margin: 0.2rem;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th { text-align: left; color: #d4af37; padding: 0.7rem; border-bottom: 1px solid #30363d; }
    td { padding: 0.7rem; border-bottom: 1px solid #21262d; }
    .stat-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 1rem;
      margin: 0.5rem 0;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">🏆 STUMBLE PRO</div>
    <nav id="navLinks">
      <div class="nav-item active" data-page="dashboard">📊 Dashboard</div>
      <div class="nav-item" data-page="players">👥 Players</div>
      <div class="nav-item" data-page="leaderboard">🏅 Leaderboard</div>
      <div class="nav-item" data-page="match">⚡ Quick Match</div>
      <div class="nav-item" data-page="tournament">🏟️ Tournament</div>
      <div class="nav-item" data-page="cup">🏆 Cup</div>
      <div class="nav-item" data-page="achievements">🌟 Achievements</div>
      <div class="nav-item" data-page="halloffame">🏛️ Hall of Fame</div>
      <div class="nav-item" data-page="history">📜 History</div>
      <div class="nav-item" data-page="admin">🔧 Admin</div>
    </nav>
  </aside>
  <main class="main-panel" id="mainContent"></main>

  <script>
    // ============ DATABASE ============
    const STORAGE_KEY = 'slmp_db_v2';
    
    function initDB() {
      if (!localStorage.getItem(STORAGE_KEY)) {
        const db = {
          players: [
            { id: 1, name: "Sankalp", username: "sankalp_op", matchesPlayed: 0, wins: 0, losses: 0, winRate: 0, totalPoints: 0, mvpCount: 0, tournamentWins: 0, cupWins: 0, currentRank: 0, highestRank: 0, currentWinStreak: 0, longestWinStreak: 0, achievements: [] },
            { id: 2, name: "Akshat Rakesh", username: "terrorbebu", matchesPlayed: 0, wins: 0, losses: 0, winRate: 0, totalPoints: 0, mvpCount: 0, tournamentWins: 0, cupWins: 0, currentRank: 0, highestRank: 0, currentWinStreak: 0, longestWinStreak: 0, achievements: [] },
            { id: 3, name: "Atharva Mishra", username: "panditdabang", matchesPlayed: 0, wins: 0, losses: 0, winRate: 0, totalPoints: 0, mvpCount: 0, tournamentWins: 0, cupWins: 0, currentRank: 0, highestRank: 0, currentWinStreak: 0, longestWinStreak: 0, achievements: [] },
            { id: 4, name: "Nayan Mehrotra", username: "nbot", matchesPlayed: 0, wins: 0, losses: 0, winRate: 0, totalPoints: 0, mvpCount: 0, tournamentWins: 0, cupWins: 0, currentRank: 0, highestRank: 0, currentWinStreak: 0, longestWinStreak: 0, achievements: [] },
            { id: 5, name: "Yugank Dwivedi", username: "yuggu", matchesPlayed: 0, wins: 0, losses: 0, winRate: 0, totalPoints: 0, mvpCount: 0, tournamentWins: 0, cupWins: 0, currentRank: 0, highestRank: 0, currentWinStreak: 0, longestWinStreak: 0, achievements: [] }
          ],
          matches: [],
          tournaments: [],
          cups: [],
          activeTournament: null,
          activeCup: null,
          hallOfFame: { tournamentKing: null, legendaryPlayer: null, mythicMaster: null }
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      }
    }
    initDB();
    
    function getDB() { return JSON.parse(localStorage.getItem(STORAGE_KEY)); }
    function saveDB(db) { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

    // ============ CORE FUNCTION: Process Match & Update Stats ============
    function processMatchResults(positions) {
      const db = getDB();
      const pointsMap = { 1: 18, 2: 15, 3: 13, 4: 12, 5: 11 };
      
      // Get all unique player IDs
      const playerIds = [...new Set(positions.map(p => p.playerId))];
      
      // Update matches played for all participants
      playerIds.forEach(pid => {
        const player = db.players.find(p => p.id === pid);
        if (player) player.matchesPlayed += 1;
      });
      
      // Find 1st place winner
      const winner = positions.find(p => p.place === 1);
      if (winner) {
        const winnerPlayer = db.players.find(p => p.id === winner.playerId);
        if (winnerPlayer) {
          winnerPlayer.wins += 1;
          winnerPlayer.mvpCount += 1;
          winnerPlayer.currentWinStreak += 1;
          if (winnerPlayer.currentWinStreak > winnerPlayer.longestWinStreak) {
            winnerPlayer.longestWinStreak = winnerPlayer.currentWinStreak;
          }
        }
      }
      
      // Process all positions
      positions.forEach(entry => {
        const player = db.players.find(p => p.id === entry.playerId);
        if (!player) return;
        
        // Add points
        player.totalPoints += (pointsMap[entry.place] || 0);
        
        // Give loss to non-winners
        if (entry.place !== 1) {
          player.losses += 1;
          player.currentWinStreak = 0;
        }
      });
      
      // RECALCULATE WIN RATES
      db.players.forEach(p => {
        if (p.matchesPlayed > 0) {
          p.winRate = parseFloat(((p.wins / p.matchesPlayed) * 100).toFixed(1));
        } else {
          p.winRate = 0;
        }
      });
      
      // UPDATE RANKINGS
      const sorted = [...db.players].sort((a, b) => {
        if (b.winRate !== a.winRate) return b.winRate - a.winRate;
        if (b.mvpCount !== a.mvpCount) return b.mvpCount - a.mvpCount;
        return b.matchesPlayed - a.matchesPlayed;
      });
      
      sorted.forEach((p, idx) => {
        p.currentRank = idx + 1;
        if (!p.highestRank || p.currentRank < p.highestRank) {
          p.highestRank = p.currentRank;
        }
      });
      
      saveDB(db);
      return db;
    }

    // ============ NAVIGATION ============
    const mainContent = document.getElementById('mainContent');
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        this.classList.add('active');
        renderPage(this.dataset.page);
      });
    });

    function renderPage(page) {
      const db = getDB();
      switch(page) {
        case 'dashboard': renderDashboard(db); break;
        case 'players': renderPlayers(db); break;
        case 'leaderboard': renderLeaderboard(db); break;
        case 'match': renderMatchCenter(db); break;
        case 'tournament': renderTournament(db); break;
        case 'cup': renderCupCenter(db); break;
        case 'achievements': renderAchievements(db); break;
        case 'halloffame': renderHallOfFame(db); break;
        case 'history': renderHistory(db); break;
        case 'admin': renderAdmin(db); break;
      }
    }

    function renderDashboard(db) {
      const sorted = [...db.players].sort((a, b) => a.currentRank - b.currentRank);
      const totalMatches = db.matches.length + db.tournaments.reduce((s, t) => s + (t.matchCount || 0), 0) + db.cups.length;
      mainContent.innerHTML = `
        <div class="card">
          <h2>📊 Dashboard</h2>
          <div class="grid-4">
            <div class="stat-box">👥 Players<br><b>${db.players.length}</b></div>
            <div class="stat-box">⚔️ Matches<br><b>${totalMatches}</b></div>
            <div class="stat-box">🏟️ Tournaments<br><b>${db.tournaments.length}</b></div>
            <div class="stat-box">🏆 Cups<br><b>${db.cups.length}</b></div>
            <div class="stat-box">🥇 #1 Player<br><b>${sorted[0]?.name || 'N/A'}</b></div>
          </div>
        </div>`;
    }

    function renderPlayers(db) {
      let html = '<div class="card"><h2>👥 Players</h2>';
      db.players.forEach(p => {
        html += `<div class="stat-box">
          <b>${p.name}</b> (@${p.username}) - Rank #${p.currentRank}<br>
          Matches: ${p.matchesPlayed} | Wins: ${p.wins} | Losses: ${p.losses} | WR: ${p.winRate}%<br>
          Points: ${p.totalPoints} | MVPs: ${p.mvpCount} | Streak: ${p.currentWinStreak}
        </div>`;
      });
      html += '</div>';
      mainContent.innerHTML = html;
    }

    function renderLeaderboard(db) {
      const sorted = [...db.players].sort((a, b) => a.currentRank - b.currentRank);
      let rows = sorted.map(p => `
        <tr>
          <td>#${p.currentRank}</td>
          <td><b>${p.name}</b></td>
          <td><b style="color:#d4af37">${p.winRate}%</b></td>
          <td>${p.mvpCount}</td>
          <td>${p.matchesPlayed}</td>
          <td>${p.wins}W/${p.losses}L</td>
        </tr>
      `).join('');
      mainContent.innerHTML = `
        <div class="card">
          <h2>🏅 Leaderboard</h2>
          <p style="color:#d4af37">Ranked by: Win Rate → MVP → Matches</p>
          <table><thead><tr><th>Rank</th><th>Player</th><th>Win Rate</th><th>MVP</th><th>Matches</th><th>W/L</th></tr></thead><tbody>${rows}</tbody></table>
        </div>`;
    }

    function renderMatchCenter(db) {
      const opts = db.players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      mainContent.innerHTML = `
        <div class="card">
          <h2>⚡ Quick Match</h2>
          <div id="matchRows"></div>
          <button onclick="addMatchRow()">+ Add Player</button>
          <button onclick="submitQuickMatch()">📤 Submit Match</button>
        </div>`;
      
      window.addMatchRow = function() {
        const div = document.getElementById('matchRows');
        div.innerHTML += `<div>
          <select class="qPlayer">${opts}</select>
          <select class="qPlace"><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option><option value="4">4th</option><option value="5">5th</option></select>
        </div>`;
      };
      
      window.submitQuickMatch = function() {
        const positions = [];
        document.querySelectorAll('#matchRows div').forEach(row => {
          positions.push({
            playerId: parseInt(row.querySelector('.qPlayer').value),
            place: parseInt(row.querySelector('.qPlace').value)
          });
        });
        if (positions.length < 2) return alert('Need at least 2 players');
        
        const db = getDB();
        db.matches.push({ date: new Date().toISOString(), positions });
        saveDB(db);
        processMatchResults(positions);
        alert('Match recorded! Stats updated.');
        renderMatchCenter(getDB());
      };
    }

    // ============ TOURNAMENT ============
    function renderTournament(db) {
      if (db.activeTournament) {
        renderActiveTournament(db);
      } else {
        const opts = db.players.map(p => `<label><input type="checkbox" class="tPlayer" value="${p.id}" checked> ${p.name}</label><br>`).join('');
        mainContent.innerHTML = `
          <div class="card">
            <h2>🏟️ Create Tournament</h2>
            <input type="text" id="tName" value="Championship" placeholder="Name">
            <input type="number" id="tMaps" value="5" min="5" max="10"> Maps per match<br>
            <input type="number" id="tMatches" value="3" min="3" max="10"> Total matches<br>
            <div style="margin:1rem 0">${opts}</div>
            <button onclick="createTournament()">Create Tournament</button>
          </div>
          ${db.tournaments.length ? renderTournamentHistory(db) : ''}`;
      }
    }

    function renderActiveTournament(db) {
      const t = db.activeTournament;
      const playerNames = {};
      db.players.forEach(p => playerNames[p.id] = p.name);
      
      let html = `<div class="card"><h2>🏟️ ${t.name}</h2>
        <p>Match ${t.currentMatch}/${t.totalMatches} | Maps: ${t.mapsPerMatch}</p>
        <h3>Standings</h3><table><tr><th>Player</th><th>Wins</th><th>Points</th></tr>`;
      
      t.standings.forEach(s => {
        html += `<tr><td>${playerNames[s.playerId]}</td><td>${s.matchWins}</td><td>${s.totalPoints}</td></tr>`;
      });
      html += '</table>';
      
      if (!t.completed) {
        html += `<h3>Record Match #${t.currentMatch}</h3><div id="tMatchRows"></div>
          <button onclick="addTMatchRow()">+ Player</button>
          <button onclick="submitTMatch()">✅ Submit</button>`;
      } else {
        html += `<p style="color:#d4af37">👑 Champion: ${playerNames[t.winner]}</p>
          <button onclick="finishTournament()">Save Tournament</button>`;
      }
      html += '</div>';
      mainContent.innerHTML = html;
      
      window.addTMatchRow = function() {
        const opts = t.participants.map(pid => `<option value="${pid}">${playerNames[pid]}</option>`).join('');
        document.getElementById('tMatchRows').innerHTML += `<div>
          <select class="tmPlayer">${opts}</select>
          <select class="tmPlace"><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option><option value="4">4th</option><option value="5">5th</option></select>
        </div>`;
      };
    }

    window.createTournament = function() {
      const db = getDB();
      const participants = [];
      document.querySelectorAll('.tPlayer:checked').forEach(cb => participants.push(parseInt(cb.value)));
      if (participants.length < 2) return alert('Need 2+ players');
      
      db.activeTournament = {
        name: document.getElementById('tName').value,
        mapsPerMatch: parseInt(document.getElementById('tMaps').value),
        totalMatches: parseInt(document.getElementById('tMatches').value),
        participants,
        standings: participants.map(pid => ({ playerId: pid, matchWins: 0, totalPoints: 0 })),
        currentMatch: 1,
        completed: false,
        winner: null,
        matchCount: 0
      };
      saveDB(db);
      renderTournament(getDB());
    };

    window.submitTMatch = function() {
      const db = getDB();
      const t = db.activeTournament;
      const positions = [];
      
      document.querySelectorAll('#tMatchRows div').forEach(row => {
        positions.push({
          playerId: parseInt(row.querySelector('.tmPlayer').value),
          place: parseInt(row.querySelector('.tmPlace').value)
        });
      });
      
      if (positions.length < 2) return alert('Need 2+ players');
      
      // THIS UPDATES GLOBAL STATS
      processMatchResults(positions);
      
      // Update tournament standings
      const winner = positions.find(p => p.place === 1);
      if (winner) {
        const standing = t.standings.find(s => s.playerId === winner.playerId);
        if (standing) standing.matchWins += 1;
      }
      
      const pointsMap = {1:18, 2:15, 3:13, 4:12, 5:11};
      positions.forEach(entry => {
        const standing = t.standings.find(s => s.playerId === entry.playerId);
        if (standing) standing.totalPoints += (pointsMap[entry.place] || 0);
      });
      
      t.matchCount++;
      t.currentMatch++;
      
      if (t.currentMatch > t.totalMatches) {
        t.completed = true;
        t.winner = [...t.standings].sort((a,b) => b.matchWins - a.matchWins)[0].playerId;
      }
      
      saveDB(db);
      alert('Tournament match recorded! Leaderboard updated.');
      renderTournament(getDB());
    };

    window.finishTournament = function() {
      const db = getDB();
      const t = db.activeTournament;
      const winner = db.players.find(p => p.id === t.winner);
      if (winner) winner.tournamentWins += 1;
      
      db.tournaments.push({ name: t.name, winner: t.winner, date: new Date().toISOString(), matchCount: t.matchCount });
      db.activeTournament = null;
      saveDB(db);
      renderTournament(getDB());
    };

    function renderTournamentHistory(db) {
      let html = '<div class="card"><h3>Tournament History</h3>';
      db.tournaments.forEach(t => {
        const w = db.players.find(p => p.id === t.winner);
        html += `<p>🏆 ${t.name} - ${w?.name} (${t.matchCount} matches)</p>`;
      });
      return html + '</div>';
    }

    // ============ CUP ============
    function renderCupCenter(db) {
      if (db.activeCup) {
        renderActiveCup(db);
      } else {
        const opts = db.players.map(p => `<label><input type="checkbox" class="cPlayer" value="${p.id}" checked> ${p.name}</label><br>`).join('');
        mainContent.innerHTML = `
          <div class="card"><h2>🏆 Cup (10 Maps)</h2>
            <div>${opts}</div>
            <button onclick="createCup()">Create Cup</button>
          </div>
          ${db.cups.length ? renderCupHistory(db) : ''}`;
      }
    }

    function renderActiveCup(db) {
      const playerNames = {};
      db.players.forEach(p => playerNames[p.id] = p.name);
      
      mainContent.innerHTML = `<div class="card"><h2>🏆 Cup Match</h2>
        <div id="cMatchRows"></div>
        <button onclick="addCMatchRow()">+ Player</button>
        <button onclick="submitCup()">🏁 Submit Cup</button></div>`;
      
      window.addCMatchRow = function() {
        const opts = db.activeCup.participants.map(pid => `<option value="${pid}">${playerNames[pid]}</option>`).join('');
        document.getElementById('cMatchRows').innerHTML += `<div>
          <select class="cmPlayer">${opts}</select>
          <select class="cmPlace"><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option><option value="4">4th</option><option value="5">5th</option></select>
        </div>`;
      };
    }

    window.createCup = function() {
      const db = getDB();
      const participants = [];
      document.querySelectorAll('.cPlayer:checked').forEach(cb => participants.push(parseInt(cb.value)));
      if (participants.length < 2) return alert('Need 2+ players');
      db.activeCup = { participants, maps: 10 };
      saveDB(db);
      renderCupCenter(getDB());
    };

    window.submitCup = function() {
      const db = getDB();
      const positions = [];
      document.querySelectorAll('#cMatchRows div').forEach(row => {
        positions.push({
          playerId: parseInt(row.querySelector('.cmPlayer').value),
          place: parseInt(row.querySelector('.cmPlace').value)
        });
      });
      
      if (positions.length < 2) return alert('Need 2+ players');
      
      // UPDATE GLOBAL STATS
      processMatchResults(positions);
      
      const winner = positions.find(p => p.place === 1);
      if (winner) {
        const wp = db.players.find(p => p.id === winner.playerId);
        if (wp) wp.cupWins += 1;
      }
      
      db.cups.push({ type: 'League Cup', winner: winner?.playerId, date: new Date().toISOString() });
      db.activeCup = null;
      saveDB(db);
      alert('Cup completed! Leaderboard updated.');
      renderCupCenter(getDB());
    };

    function renderCupHistory(db) {
      let html = '<div class="card"><h3>Cup History</h3>';
      db.cups.forEach(c => {
        const w = db.players.find(p => p.id === c.winner);
        html += `<p>🥤 ${c.type} - ${w?.name}</p>`;
      });
      return html + '</div>';
    }

    function renderAchievements(db) {
      let html = '<div class="card"><h2>🌟 Achievements</h2>';
      db.players.forEach(p => {
        html += `<p><b>${p.name}</b>: ${p.achievements.length ? p.achievements.join(', ') : 'None'}</p>`;
      });
      mainContent.innerHTML = html + '</div>';
    }

    function renderHallOfFame(db) {
      const h = db.hallOfFame;
      const n = (id) => db.players.find(p => p.id === id)?.name || '—';
      mainContent.innerHTML = `<div class="card"><h2>🏛️ Hall of Fame</h2>
        <p>🏆 Tournament King: ${n(h.tournamentKing)}</p>
        <p>🌟 Legendary Player: ${n(h.legendaryPlayer)}</p>
        <p>⚡ Mythic Master: ${n(h.mythicMaster)}</p></div>`;
    }

    function renderHistory(db) {
      let html = '<div class="card"><h2>📜 History</h2>';
      db.matches.forEach(m => html += `<p>Match - ${new Date(m.date).toLocaleDateString()}</p>`);
      db.tournaments.forEach(t => html += `<p>🏆 ${t.name}</p>`);
      db.cups.forEach(c => html += `<p>🥤 ${c.type}</p>`);
      mainContent.innerHTML = html + '</div>';
    }

    function renderAdmin(db) {
      mainContent.innerHTML = `<div class="card"><h2>🔧 Admin</h2>
        <button onclick="exportDB()">Export JSON</button>
        <input type="file" id="importFile"><button onclick="importDB()">Import</button>
        <button onclick="resetDB()">Reset All</button></div>`;
      
      window.exportDB = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(getDB())], {type:'application/json'}));
        a.download = 'backup.json';
        a.click();
      };
      
      window.importDB = () => {
        const f = document.getElementById('importFile').files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = e => { localStorage.setItem(STORAGE_KEY, e.target.result); location.reload(); };
        r.readAsText(f);
      };
      
      window.resetDB = () => {
        if (confirm('Delete all?')) { localStorage.removeItem(STORAGE_KEY); initDB(); location.reload(); }
      };
    }

    // Initial render
    renderPage('dashboard');
  </script>
</body>
</html>
