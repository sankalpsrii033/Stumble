<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stumble League Manager Pro</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0e14;font-family:'Segoe UI',sans-serif;color:#e0e0e0;display:flex;min-height:100vh}
    .sidebar{width:260px;background:#11161e;border-right:2px solid #d4af37;padding:1.5rem;position:sticky;top:0;height:100vh;overflow-y:auto}
    .logo{font-size:1.6rem;font-weight:800;color:#d4af37;text-align:center;margin-bottom:2rem}
    .nav-item{padding:.8rem;margin:.3rem 0;border-radius:8px;cursor:pointer;color:#888;font-weight:600}
    .nav-item:hover,.nav-item.active{background:rgba(212,175,55,0.15);color:#d4af37}
    .nav-item.locked{color:#666}
    .nav-item.locked::after{content:" 🔒";font-size:.7rem}
    .main-panel{flex:1;padding:2rem;overflow-y:auto}
    .card{background:#11161e;border:1px solid #2a3040;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
    h2{color:#d4af37;margin-bottom:1rem}
    h3{color:#e0b040;margin:1rem 0}
    button{background:#d4af37;color:#000;border:none;padding:.6rem 1.2rem;border-radius:6px;font-weight:700;cursor:pointer;margin:.3rem}
    button:hover{background:#e8c550}
    button.danger{background:#c44;color:#fff}
    button.danger:hover{background:#f55}
    button.unlock-btn{background:#2a3040;color:#d4af37;border:1px solid #d4af37}
    button.unlock-btn:hover{background:#d4af37;color:#000}
    select,input{background:#0a0e14;border:1px solid #2a3040;color:#fff;padding:.5rem;border-radius:6px;margin:.2rem}
    table{width:100%;border-collapse:collapse;margin:1rem 0}
    th{text-align:left;color:#d4af37;padding:.7rem;border-bottom:2px solid #d4af37}
    td{padding:.7rem;border-bottom:1px solid #1a2030}
    .stat-box{background:#0a0e14;border:1px solid #2a3040;border-radius:8px;padding:1rem;margin:.5rem 0}
    .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem}
    .badge{background:#d4af37;color:#000;padding:.2rem .7rem;border-radius:12px;font-weight:700;font-size:.85rem}
    .locked-badge{background:#c44;color:#fff;padding:.2rem .7rem;border-radius:12px;font-weight:700;font-size:.75rem}
    .unlocked-badge{background:#4c4;color:#fff;padding:.2rem .7rem;border-radius:12px;font-weight:700;font-size:.75rem}
    .hof-card{background:linear-gradient(135deg,#1a1f2e,#0d1117);border:2px solid #d4af37;border-radius:16px;padding:1.5rem;margin:1rem 0;text-align:center}
    .hof-title{font-size:1.1rem;color:#888;margin-bottom:.5rem}
    .hof-name{font-size:1.8rem;font-weight:800;color:#d4af37;margin:.5rem 0}
    .hof-icon{font-size:3rem;margin:.5rem 0}
    .hof-stat{font-size:1rem;color:#e0b040}
    #passwordModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:1000}
    .modal-box{background:#11161e;border:2px solid #d4af37;border-radius:16px;padding:2rem;text-align:center;min-width:350px}
    .modal-box input{width:100%;margin:1rem 0;font-size:1.1rem;text-align:center}
    .error-msg{color:#f66;margin:.5rem 0;font-size:.9rem}
    .season-card{cursor:pointer;transition:0.2s}
    .season-card:hover{background:#1a2030}
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">🏆 STUMBLE PRO</div>
  <div style="text-align:center;margin-bottom:1rem">
    <span id="lockStatus" class="locked-badge">🔒 LOCKED</span>
  </div>
  <nav id="nav">
    <div class="nav-item active" data-p="dashboard">📊 Dashboard</div>
    <div class="nav-item" data-p="players">👥 Players</div>
    <div class="nav-item" data-p="leaderboard">🏅 Leaderboard</div>
    <div class="nav-item locked" data-p="tournament">🏟️ Tournament 🔒</div>
    <div class="nav-item locked" data-p="cup">🏆 Cup 🔒</div>
    <div class="nav-item" data-p="hof">🏛️ Hall of Fame</div>
    <div class="nav-item" data-p="history">📜 History</div>
    <div class="nav-item locked" data-p="seasons">📅 Seasons 🔒</div>
    <div class="nav-item locked" data-p="admin">🔧 Admin 🔒</div>
    <button class="unlock-btn" onclick="toggleLock()" style="width:100%;margin-top:1rem">🔑 Unlock Admin</button>
  </nav>
</aside>
<main class="main-panel" id="main"></main>

<div id="passwordModal" style="display:none">
  <div class="modal-box">
    <h2 style="color:#d4af37">🔐 Admin Access</h2>
    <p style="color:#888">Enter password to unlock admin features</p>
    <input type="password" id="pwdInput" placeholder="Enter password" onkeypress="if(event.key==='Enter')checkPassword()">
    <p class="error-msg" id="pwdError"></p>
    <button onclick="checkPassword()" style="width:100%">🔓 Unlock</button>
    <button onclick="closeModal()" style="background:#444;color:#fff;width:100%;margin-top:.5rem">Cancel</button>
  </div>
</div>

<script>
// ============ PASSWORD ============
const ADMIN_PASSWORD = "stumble2026";
let isUnlocked = false;

function toggleLock(){
  if(isUnlocked){
    isUnlocked = false;
    updateLockUI();
    render('dashboard');
  }else{
    document.getElementById('passwordModal').style.display = 'flex';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdError').textContent = '';
    document.getElementById('pwdInput').focus();
  }
}

function checkPassword(){
  if(document.getElementById('pwdInput').value === ADMIN_PASSWORD){
    isUnlocked = true;
    document.getElementById('passwordModal').style.display = 'none';
    updateLockUI();
    alert('✅ Admin features unlocked!');
    render('dashboard');
  }else{
    document.getElementById('pwdError').textContent = '❌ Wrong password!';
    document.getElementById('pwdInput').value = '';
  }
}

function closeModal(){ document.getElementById('passwordModal').style.display = 'none'; }

function updateLockUI(){
  const status = document.getElementById('lockStatus');
  document.querySelectorAll('.nav-item.locked').forEach(item => {
    if(isUnlocked){
      item.classList.remove('locked');
      item.innerHTML = item.innerHTML.replace(' 🔒','');
    }else{
      if(!item.classList.contains('locked')){
        item.classList.add('locked');
        if(!item.innerHTML.includes('🔒')) item.innerHTML += ' 🔒';
      }
    }
  });
  status.className = isUnlocked ? 'unlocked-badge' : 'locked-badge';
  status.textContent = isUnlocked ? '🔓 UNLOCKED' : '🔒 LOCKED';
}

function isAdminAllowed(){ return isUnlocked; }

// ============ DATABASE ============
const K='slm_v8';
function createFreshCurrent(){
  return {
    players: [
      {id:1,n:"Sankalp",u:"sankalp_op",mp:0,w:0,l:0,wr:0,pts:0,mvp:0,tw:0,cw:0,rk:0,hr:0,st:0,bs:0,ach:[]},
      {id:2,n:"Akshat Rakesh",u:"terrorbebu",mp:0,w:0,l:0,wr:0,pts:0,mvp:0,tw:0,cw:0,rk:0,hr:0,st:0,bs:0,ach:[]},
      {id:3,n:"Atharva Mishra",u:"panditdabang",mp:0,w:0,l:0,wr:0,pts:0,mvp:0,tw:0,cw:0,rk:0,hr:0,st:0,bs:0,ach:[]},
      {id:4,n:"Nayan Mehrotra",u:"nbot",mp:0,w:0,l:0,wr:0,pts:0,mvp:0,tw:0,cw:0,rk:0,hr:0,st:0,bs:0,ach:[]},
      {id:5,n:"Yugank Dwivedi",u:"yuggu",mp:0,w:0,l:0,wr:0,pts:0,mvp:0,tw:0,cw:0,rk:0,hr:0,st:0,bs:0,ach:[]}
    ],
    tournaments: [],
    cups: [],
    hof: {goat:null,sp:null,lg:null,mm:null},
    activeT: null,
    activeCup: null
  };
}

function migrateOldData(existing){
  // Already new structure
  if(existing && existing.seasons && existing.current) return existing;
  // Old structure with players array at top level
  if(existing && (existing.players || existing.p)){
    let players = existing.players || existing.p;
    let tournaments = existing.tournaments || existing.t || [];
    let cups = existing.cups || existing.c || [];
    // Map old hof keys to new ones if needed
    let hof = existing.hof || {};
    if(hof.tk && !hof.sp){ hof.sp = hof.tk; delete hof.tk; }
    if(hof.lp && !hof.lg){ hof.lg = hof.lp; delete hof.lp; }
    if(hof.mm && !hof.mm){ hof.mm = hof.mm; }
    const newDB = {
      seasons: [{
        id: 1,
        name: "Season 1",
        players: JSON.parse(JSON.stringify(players)),
        tournaments: JSON.parse(JSON.stringify(tournaments)),
        cups: JSON.parse(JSON.stringify(cups)),
        hof: JSON.parse(JSON.stringify(hof)),
        date: new Date().toISOString()
      }],
      current: createFreshCurrent()
    };
    return newDB;
  }
  // Fresh start
  return { seasons: [], current: createFreshCurrent() };
}

if(!localStorage.getItem(K)){
  localStorage.setItem(K, JSON.stringify({ seasons: [], current: createFreshCurrent() }));
}else{
  let db = JSON.parse(localStorage.getItem(K));
  if(!db.seasons || !db.current){
    db = migrateOldData(db);
    localStorage.setItem(K, JSON.stringify(db));
  }
}

function g(){ return JSON.parse(localStorage.getItem(K)); }
function s(d){ localStorage.setItem(K, JSON.stringify(d)); }

function getCurrent(){
  let db = g();
  return db.current;
}

// ============ HALL OF FAME ============
function updateHallOfFame(cur){
  let p = cur.players;
  if(p.length===0) return;
  let byWR = [...p].sort((a,b)=>b.wr-a.wr||b.mp-a.mp);
  cur.hof.goat = byWR[0].id;
  let byTW = [...p].sort((a,b)=>b.tw-a.tw||b.mp-a.mp);
  cur.hof.sp = byTW[0].id;
  let byCW = [...p].sort((a,b)=>b.cw-a.cw||b.mp-a.mp);
  cur.hof.lg = byCW[0].id;
  let byMVP = [...p].sort((a,b)=>b.mvp-a.mvp||b.mp-a.mp);
  cur.hof.mm = byMVP[0].id;
}

function updateStats(pos){
  let db = g();
  let cur = db.current;
  let pts={1:18,2:15,3:13,4:12,5:11};
  let ids=[...new Set(pos.map(x=>x.pid))];
  ids.forEach(id=>{let p=cur.players.find(x=>x.id===id);if(p)p.mp+=1;});
  let w=pos.find(x=>x.place===1);
  if(w){let wp=cur.players.find(x=>x.id===w.pid);if(wp){wp.w+=1;wp.mvp+=1;wp.st+=1;if(wp.st>wp.bs)wp.bs=wp.st;}}
  pos.forEach(e=>{
    let p=cur.players.find(x=>x.id===e.pid);if(!p)return;
    p.pts+=(pts[e.place]||0);
    if(e.place!==1){p.l+=1;p.st=0;}
  });
  cur.players.forEach(p=>{p.wr=p.mp>0?parseFloat(((p.w/p.mp)*100).toFixed(1)):0;});
  let srt=[...cur.players].sort((a,b)=>b.wr-a.wr||b.mvp-a.mvp||b.mp-a.mp);
  srt.forEach((p,i)=>{p.rk=i+1;if(!p.hr||p.rk<p.hr)p.hr=p.rk;});
  cur.players.forEach(p=>{
    if(p.tw>=1&&!p.ach.includes('t1'))p.ach.push('t1');
    if(p.tw>=5&&!p.ach.includes('t5'))p.ach.push('t5');
    if(p.tw>=10&&!p.ach.includes('t10'))p.ach.push('t10');
    if(p.cw>=1&&!p.ach.includes('c1'))p.ach.push('c1');
    if(p.cw>=10&&!p.ach.includes('c10'))p.ach.push('c10');
    if(p.mvp>=1&&!p.ach.includes('m1'))p.ach.push('m1');
    if(p.mvp>=25&&!p.ach.includes('m25'))p.ach.push('m25');
    if(p.mvp>=50&&!p.ach.includes('m50'))p.ach.push('m50');
  });
  updateHallOfFame(cur);
  s(db);
}

// ============ NAVIGATION ============
document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click',function(){
    const page = this.dataset.p;
    const lockedPages = ['tournament','cup','seasons','admin'];
    if(lockedPages.includes(page) && !isAdminAllowed()){
      alert('🔒 This feature is locked! Click "Unlock Admin" and enter password.');
      return;
    }
    document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    render(page);
  });
});

function render(pg){
  let db = g();
  let cur = db.current;
  switch(pg){
    case 'dashboard': dash(cur); break;
    case 'players': plist(cur); break;
    case 'leaderboard': lb(cur); break;
    case 'tournament': tour(cur); break;
    case 'cup': cup(cur); break;
    case 'hof': hall(cur); break;
    case 'history': hist(cur); break;
    case 'seasons': seasonsPage(db); break;
    case 'admin': adm(db); break;
  }
}

// ... (rest of the functions remain same until seasonsPage) ...

// ============ SEASONS (FIXED IMPORT) ============
function seasonsPage(db){
  if(!isAdminAllowed()){document.getElementById('main').innerHTML='<div class="card"><h2>🔒 Access Denied</h2></div>';return;}
  let html = '<div class="card"><h2>📅 Seasons</h2>';
  html += `<button onclick="endSeason()">🏁 End Current Season & Start New</button>
           <button onclick="importSeasonBackup()">📥 Import Season from Backup</button>`;
  
  if(db.seasons.length === 0){
    html += '<p style="margin-top:1rem">No past seasons yet.</p>';
  }else{
    html += '<h3>Past Seasons</h3>';
    db.seasons.forEach((season, idx) => {
      html += `<div class="stat-box season-card" onclick="viewSeason(${idx})" style="cursor:pointer;">
        <b>${season.name}</b> (${season.players.length} players, ${season.tournaments.length} tournaments, ${season.cups.length} cups)
        <br><small>Ended: ${new Date(season.date).toLocaleDateString()}</small>
      </div>`;
    });
  }
  html += '</div>';
  document.getElementById('main').innerHTML = html;
}

window.endSeason = function(){
  if(!isAdminAllowed()) return;
  let name = prompt('Enter name for the new season (e.g., Season 2):', 'Season ' + (g().seasons.length+2));
  if(!name) return;
  let db = g();
  let cur = db.current;
  let seasonData = {
    id: db.seasons.length + 1,
    name: name,
    players: JSON.parse(JSON.stringify(cur.players)),
    tournaments: JSON.parse(JSON.stringify(cur.tournaments)),
    cups: JSON.parse(JSON.stringify(cur.cups)),
    hof: JSON.parse(JSON.stringify(cur.hof)),
    date: new Date().toISOString()
  };
  db.seasons.push(seasonData);
  db.current = createFreshCurrent();
  s(db);
  alert('Season archived! New season started fresh.');
  render('seasons');
};

// FIXED IMPORT FUNCTION
window.importSeasonBackup = function(){
  let input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e){
    let file = e.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = function(ev){
      try{
        let data = JSON.parse(ev.target.result);
        let players, tournaments, cups, hof;
        
        // Detect format
        if(data.current){
          // New format with seasons
          players = data.current.players;
          tournaments = data.current.tournaments;
          cups = data.current.cups;
          hof = data.current.hof || {};
        }else if(data.players || data.p){
          // Old format: direct players array
          players = data.players || data.p;
          tournaments = data.tournaments || data.t || [];
          cups = data.cups || data.c || [];
          hof = data.hof || {};
          // Convert old hof keys if present
          if(hof.tk && !hof.sp){ hof.sp = hof.tk; delete hof.tk; }
          if(hof.lp && !hof.lg){ hof.lg = hof.lp; delete hof.lp; }
          if(!hof.goat) hof.goat = null;
          if(!hof.sp) hof.sp = null;
          if(!hof.lg) hof.lg = null;
          if(!hof.mm) hof.mm = null;
        }else{
          alert('❌ Invalid backup file! The file must contain player data.');
          return;
        }
        
        let seasonName = prompt('Enter a name for this imported season:', 'Imported Season');
        if(!seasonName) return;
        
        let db = g();
        db.seasons.push({
          id: db.seasons.length+1,
          name: seasonName,
          players: players,
          tournaments: tournaments,
          cups: cups,
          hof: hof,
          date: new Date().toISOString()
        });
        s(db);
        alert('✅ Season imported successfully!');
        render('seasons');
      }catch(e){
        alert('❌ Error reading file: ' + e.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
};

// ... (viewSeason, admin, etc. remain unchanged) ...

// ============ ADMIN (fixed import) ============
function adm(db){
  if(!isAdminAllowed()){document.getElementById('main').innerHTML='<div class="card"><h2>🔒 Access Denied</h2></div>';return;}
  document.getElementById('main').innerHTML=`<div class="card"><h2>🔧 Admin</h2>
    <p style="color:#4c4;margin-bottom:1rem">✅ Admin mode active</p>
    <button onclick="exp()">📤 Export Full Backup</button>
    <input type="file" id="imf" accept=".json"><button onclick="imp()">📥 Import Full Backup</button>
    <button onclick="changePwd()">🔑 Change Password</button>
    <button onclick="rst()" style="background:#c44;color:#fff">⚠️ Reset All</button></div>`;
  window.exp=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(g(),null,2)],{type:'application/json'}));a.download='stumble_backup.json';a.click();};
  window.imp=()=>{
    let f=document.getElementById('imf').files[0];
    if(!f)return;
    let r=new FileReader();
    r.onload=e=>{
      try{
        let data = JSON.parse(e.target.result);
        // If old format, migrate it
        if(!data.seasons || !data.current){
          data = migrateOldData(data);
        }
        localStorage.setItem(K, JSON.stringify(data));
        alert('✅ Database imported! Refreshing...');
        location.reload();
      }catch(err){
        alert('❌ Invalid JSON file.');
      }
    };
    r.readAsText(f);
  };
  window.rst=()=>{if(confirm('Delete all?')){localStorage.removeItem(K);location.reload();}};
  window.changePwd=()=>{let np=prompt('Enter new password:');if(np&&np.length>=4){ADMIN_PASSWORD=np;alert('Password changed!');}};
}

// Initialize Hall of Fame on current
let initDB = g();
updateHallOfFame(initDB.current);
s(initDB);
render('dashboard');
</script>
</body>
</html>
